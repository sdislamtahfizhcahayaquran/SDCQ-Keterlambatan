name: Fix CQ logo display

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make CQ logo visible on GitHub Pages
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;object-fit:contain;border-radius:12px;background:#fff}.brand h1{font-size:16px;margin:0;color:var(--navy)}"
          new_css = ".brand{display:flex;align-items:center;gap:14px}.logo-wrap{width:68px;height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;overflow:hidden}.logo{width:64px;height:64px;object-fit:contain;display:block}.logo-fallback{width:58px;height:58px;border-radius:14px;display:none;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:800;font-size:17px;letter-spacing:.5px}.brand h1{font-size:16px;margin:0;color:var(--navy)}"
          if old_css in s:
              s = s.replace(old_css, new_css)

          old_mobile = ".topbar{padding:11px 13px}.logo{width:43px;height:43px}.live"
          new_mobile = ".topbar{padding:11px 13px}.logo-wrap{width:56px;height:56px;flex-basis:56px}.logo{width:52px;height:52px}.logo-fallback{width:50px;height:50px}.live"
          if old_mobile in s:
              s = s.replace(old_mobile, new_mobile)

          old_img = '<img class="logo" src="logo_sd.png" alt="Logo sekolah" />'
          new_img = '<span class="logo-wrap"><img class="logo" src="https://sdislamtahfizhcahayaquran.github.io/SDCQ-Keterlambatan/logo_sd.png?v=20260917" alt="Logo CQ" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><span class="logo-fallback">CQ</span></span>'
          if old_img in s:
              s = s.replace(old_img, new_img)

          p.write_text(s, encoding='utf-8')

      - name: Commit logo fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix CQ logo display on GitHub Pages"
          git push
